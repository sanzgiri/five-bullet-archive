name: Refresh newsletter archive from Gmail

on:
  schedule:
    - cron: "17 16 * * 6" # Saturday morning Pacific; 08:17 PST / 09:17 PDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-newsletter-archive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fetch recent newsletter emails from Gmail
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_SENDER: tim@fourhourbody.com
          GMAIL_IMPORT_DIR: /tmp/five-bullet-gmail
          GMAIL_LOOKBACK_DAYS: "14"
        run: npm run archive:fetch-gmail
      - name: Import newsletter issues
        run: npm run archive:import-eml -- /tmp/five-bullet-gmail --write --source=gmail
      - run: npm run archive:build
      - run: npm run archive:audit
      - name: Commit refreshed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletters/issues data/newsletters/index.jsonl public/archive-data.json
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
          else
            git commit -m "Refresh newsletter archive from Gmail"
            git push
          fi
