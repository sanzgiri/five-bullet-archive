name: Refresh newsletter archive

on:
  schedule:
    - cron: "17 16 * * 6" # Saturday 08:17 Pacific (UTC varies with daylight saving)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-newsletter-archive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore Microsoft Graph token cache
        uses: actions/cache@v4
        with:
          path: .cache/microsoft-msal-cache.json
          key: microsoft-graph-token-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            microsoft-graph-token-cache-${{ runner.os }}-
      - run: npm ci
      - name: Fetch recent Hotmail issues
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_TOKEN_CACHE: ${{ secrets.MICROSOFT_TOKEN_CACHE }}
        run: npm run archive:extract-hotmail -- --start "$(date -u -d '14 days ago' +%F)" --non-interactive
      - run: npm run archive:build
      - run: npm run archive:audit
      - name: Commit refreshed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletters/issues data/newsletters/index.jsonl public/archive-data.json
          if git diff --cached --quiet; then
            echo "No archive changes to publish."
          else
            git commit -m "Refresh newsletter archive"
            git push
          fi
